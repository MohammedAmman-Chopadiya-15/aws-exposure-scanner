name: Keyless Deployment to AWS via OIDC

on:
  push:
    branches:
    - main

# Permission required to request the OIDC JWT token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy-terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    # KEYLESS AUTHENTICATION USING AWS OIDC
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-deployer # Replace with your Account ID
        aws-region: eu-west-2

    - name: Terraform Init
      run: terraform init
      working-directory: infrastructure

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: infrastructure
